<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>viver a Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --ink: #141210;
      --paper: #f3efe6;
      --muted: #8a8175;
      --line: rgba(243, 239, 230, 0.16);
      --brass: #d7b07a;
      --danger: #c94a4a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: "Outfit", sans-serif;
      font-weight: 300;
    }

    button, input, select { font: inherit; color: inherit; }

    /* Correção de legibilidade para selects e opções */
    select, option {
      background-color: #1c1916;
      color: var(--paper);
    }

    select option {
      padding: 0.5rem;
    }

    /* Modal de Login */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 18, 16, 0.95);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-card {
      background: #1c1916;
      border: 1px solid var(--line);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
    }
    .modal-card h2 {
      font-family: "Cormorant Garamond", serif;
      margin-top: 0;
      font-size: 2.2rem;
      color: var(--brass);
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .form-group select, .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: #1c1916;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--paper);
    }

    /* Top Bar / Config button */
    .top-bar {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      z-index: 10;
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .user-badge {
      font-size: 0.85rem;
      color: var(--brass);
    }

    .hero {
      position: relative;
      min-height: 78vh;
      display: grid;
      align-items: end;
      overflow: hidden;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
    }
