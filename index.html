<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viver a Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #141210; --paper: #f3efe6; --muted: #8a8175;
      --line: rgba(243, 239, 230, 0.16); --brass: #d7b07a; --danger: #c94a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Outfit", sans-serif; font-weight: 300; }
    button, input, select { font: inherit; color: inherit; }
    select, option { background-color: #1c1916; color: var(--paper); }
    select option { padding: 0.5rem; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(20, 18, 16, 0.95); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-card { background: #1c1916; border: 1px solid var(--line); padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 420px; }
    .modal-card h2 { font-family: "Cormorant Garamond", serif; margin-top: 0; font-size: 2.2rem; color: var(--brass); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--muted); }
    .form-group select, .form-group input { width: 100%; padding: 0.75rem; background: #1c1916; border: 1px solid var(--line); border-radius: 6px; color: var(--paper); }

    .top-bar { position: absolute; top: 1.5rem; right: 2rem; z-index: 10; display: flex; gap: 1rem; align-items: center; }
    .user-badge { font-size: 0.85rem; color: var(--brass); }

    .hero { position: relative; min-height: 78vh; display: grid; align-items: end; overflow: hidden; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,18,16,0.92) 0%, rgba(20,18,16,0.2) 46%, rgba(20,18,16,0.18) 100%); }
    .hero-copy { position: relative; z-index: 1; padding: 8vh 7vw 6vh; max-width: 920px; }
    .eyebrow { margin: 0 0 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.72rem; color: var(--brass); }
    h1 { margin: 0; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(3.4rem, 8vw, 7.2rem); line-height: 0.9; letter-spacing: -0.03em; }
    .lede { margin: 1.1rem 0 0; max-width: 36rem; color: rgba(243,239,230,0.82); font-size: 1.05rem; line-height: 1.5; }

    main { padding: 2.2rem 7vw 5rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; }

    .btn { border: 1px solid var(--line); background: transparent; padding: 0.75rem 1.15rem; border-radius: 999px; cursor: pointer; letter-spacing: 0.04em; }
    .btn:hover { border-color: var(--brass); color: var(--brass); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-solid { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    .btn-solid:hover { background: var(--brass); color: var(--ink); border-color: var(--brass); }

    .filters-panel {
      background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 12px;
      padding: 1.2rem; padding-bottom: 4.2rem; margin-bottom: 1.6rem; position: relative;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;
    }
    .filter-box { display: flex; flex-direction: column; gap: 0.4rem; }
    .filter-box label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); }
    .scroll-select-box { max-height: 130px; overflow-y: auto; background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem; }
    .scroll-select-box label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--paper); cursor: pointer; padding: 0.2rem 0; text-transform: none; letter-spacing: normal; }

    .upload-section-box { background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.6rem; max-width: 600px; }
    .trabalhos-curso-lista { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.8rem; max-height: 160px; overflow-y: auto; }
    .trabalho-opcao { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; border-radius: 6px; background: rgba(0,0,0,0.2); border: 1px solid var(--line); cursor: pointer; transition: all 0.2s; }
    .trabalho-opcao:hover { border-color: var(--brass); }
    .trabalho-opcao.selecionado { border-color: var(--brass); background: rgba(215, 176, 122, 0.1); }
    .trabalho-opcao.destacado { color: var(--paper); font-weight: 500; }
    .trabalho-opcao.atenuado { color: var(--muted); font-size: 0.9rem; }

    .drop { border: 1px dashed rgba(215, 176, 122, 0.45); border-radius: 12px; padding: 1.2rem 1.3rem; margin-top: 1rem; display: flex; justify-content: space-between; gap: 1rem; align-items: center; cursor: pointer; }
    .drop.over { background: rgba(215, 176, 122, 0.08); }
    .drop p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }

    .count { color: var(--muted); font-size: 0.92rem; }
    .status { min-height: 1.4rem; margin: 0 0 1rem; color: var(--brass); }
    .section-group-title { font-family: "Cormorant Garamond", serif; font-size: 1.8rem; color: var(--brass); margin: 2rem 0 1rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.8rem; }
    .card { margin: 0; position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #221f1b; cursor: pointer; }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
    .card:hover img { transform: scale(1.04); }
